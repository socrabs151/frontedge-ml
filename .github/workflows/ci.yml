name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Token contrast
        run: pnpm check:contrast

      - name: Build the npm package
        run: pnpm --filter @frontedge/ui build

      - name: Build the interface
        run: pnpm build:ui

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install Python workspace
        run: uv sync --all-packages

      - name: Python contract tests
        run: uv run --package frontedge pytest python/frontedge/tests -q

      - name: Configuration check
        run: uv run --package frontedge frontedge check examples/demo-ml/frontedge.toml

      - name: Check generated types are up to date
        run: |
          uv run --package frontedge frontedge gen --out packages/ui/src/generated
          git diff --exit-code packages/ui/src/generated

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages
          pnpm build:ui

      - name: Install browser
        run: pnpm --filter @frontedge/spike exec playwright install --with-deps chromium

      - name: Start the demo
        run: |
          nohup uv run --package frontedge-demo-ml demo-ml > demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/frontedge/api/meta > /dev/null && break
            sleep 1
          done

      - name: Axe and screenshots
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/verify.mjs

      - name: Keyboard pass
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/keyboard-check.mjs

      - name: Phase 3 screens audit
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/phase3-shots.mjs

      - name: Language audit
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: pnpm check:lang
