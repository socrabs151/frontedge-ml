name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Token contrast
        run: pnpm check:contrast

      - name: Build the npm package
        run: pnpm --filter @frontedge-ml/ui build

      - name: Package contents
        run: |
          mkdir -p /tmp/ui-pack
          pnpm --filter @frontedge-ml/ui pack --pack-destination /tmp/ui-pack
          tar -tzf /tmp/ui-pack/*.tgz | grep -q 'package/dist/styles.css'
          tar -tzf /tmp/ui-pack/*.tgz | grep -q 'package/dist/index.js'
          tar -tzf /tmp/ui-pack/*.tgz | grep -q 'package/LICENSE'

      - name: Build the interface
        run: pnpm build:ui

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install Python workspace
        run: uv sync --all-packages

      - name: Python lint
        run: uv run --package frontedge ruff check python/frontedge

      - name: Python types
        run: uv run --package frontedge mypy python/frontedge/src

      - name: Python contract tests
        run: uv run --package frontedge pytest python/frontedge/tests -q 2>&1 | tee pytest.log

      - name: Surface the failing tests
        if: failure()
        run: |
          [ -f pytest.log ] || exit 0
          grep -E "^(FAILED|ERROR)" pytest.log | head -n 40 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

      - name: Configuration check
        run: uv run --package frontedge frontedge check examples/demo-ml/frontedge.toml

      - name: Smoke the built wheel
        run: |
          rm -rf dist /tmp/smoke-env /tmp/smoke-app
          uv build --package frontedge
          uv venv /tmp/smoke-env
          uv pip install --python /tmp/smoke-env/bin/python dist/*.whl 'uvicorn>=0.32'
          /tmp/smoke-env/bin/frontedge init /tmp/smoke-app
          cd /tmp/smoke-app
          /tmp/smoke-env/bin/uvicorn app:app --port 8099 > /tmp/smoke.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/frontedge/api/meta > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/frontedge/api/runs | grep -q baseline
          curl -sf http://127.0.0.1:8099/frontedge/ | grep -q 'id="root"'

      - name: Check generated types are up to date
        run: |
          uv run --package frontedge frontedge gen --out packages/ui/src/generated
          git diff --exit-code packages/ui/src/generated

  python-311:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install on Python 3.11
        run: uv sync --all-packages --python 3.11

      - name: Contract tests on 3.11
        run: |
          uv run --package frontedge python --version
          uv run --package frontedge pytest python/frontedge/tests -q 2>&1 | tee pytest-311.log

      - name: Surface the failing tests
        if: failure()
        run: |
          [ -f pytest-311.log ] || exit 0
          grep -E "^(FAILED|ERROR)" pytest-311.log | head -n 40 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

  cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages
          pnpm build:ui

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @frontedge/spike exec playwright install --with-deps ${{ matrix.browser }}

      - name: Start the demo
        run: |
          nohup uv run --package frontedge-demo-ml demo-ml > demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/frontedge/api/meta > /dev/null && break
            sleep 1
          done

      - name: Axe, states and routing
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
          FE_BROWSER: ${{ matrix.browser }}
        run: node apps/spike/scripts/verify.mjs

      - name: Keyboard pass
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
          FE_BROWSER: ${{ matrix.browser }}
        run: node apps/spike/scripts/keyboard-check.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages
          pnpm build:ui

      - name: Install browser
        run: pnpm --filter @frontedge/spike exec playwright install --with-deps chromium

      - name: Start the demo
        run: |
          nohup uv run --package frontedge-demo-ml demo-ml > demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/frontedge/api/meta > /dev/null && break
            sleep 1
          done

      - name: Axe and screenshots
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/verify.mjs

      - name: Keyboard pass
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/keyboard-check.mjs

      - name: Phase 3 screens audit
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: node apps/spike/scripts/phase3-shots.mjs

      - name: Language audit
        env:
          FE_BASE_URL: http://127.0.0.1:8000/frontedge
        run: pnpm check:lang

      - name: Consumer smoke (React 18)
        run: node apps/spike/scripts/smoke-npm.mjs
