name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Token contrast
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"

      - name: Install Python workspace
        run: uv sync --all-packages

      - name: Python contract tests
        run: uv run --package frontedge pytest python/frontedge/tests -q

      - name: Check generated types are up to date
        run: |
          uv run --package frontedge frontedge gen --out packages/ui/src/generated
          git diff --exit-code packages/ui/src/generated
