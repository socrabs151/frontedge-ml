name: Release

# Publish on a tag: git tag vX.Y.Z && git push origin vX.Y.Z
# Both registries authenticate through Trusted Publishing (OIDC), with no long-lived tokens:
#   npm  — package Settings → Trusted Publisher (GitHub Actions, release.yml, npm publish);
#   PyPI — project → Publishing → GitHub (release.yml).
# A manual dispatch is deliberately disabled: the version comes from the tag, not from a click.

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: pnpm typecheck
      - run: pnpm check:contrast
      - run: node apps/spike/scripts/lang-audit.mjs --no-browser
      - name: The tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('python/frontedge/pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./packages/ui/package.json').version")
          echo "tag=$tag python=$py npm=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: pnpm build:ui
      - run: uv run --package frontedge pytest python/frontedge/tests -q
      - run: uv run --package frontedge frontedge gen --check --out packages/ui/src/generated

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1+; Node 22 still bundles npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frontedge-ml/ui build
      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/ui

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      # The wheel ships the built interface: without this the package serves 503.
      - run: pnpm build:ui
      - name: Build the wheel
        run: uv build --package frontedge
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
