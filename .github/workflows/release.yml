name: Release

# Publish on a tag: git tag v0.1.0 && git push origin v0.1.0
# Required repository secrets: PYPI_API_TOKEN, NPM_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: pnpm typecheck
      - run: pnpm check:contrast
      - run: node apps/spike/scripts/lang-audit.mjs --no-browser
      - name: The tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('python/frontedge/pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./packages/ui/package.json').version")
          echo "tag=$tag python=$py npm=$js"
          test "$tag" = "$py" && test "$tag" = "$js"
      - run: pnpm build:ui
      - run: uv run --package frontedge pytest python/frontedge/tests -q
      - run: uv run --package frontedge frontedge gen --out packages/ui/src/generated
      - run: git diff --exit-code packages/ui/src/generated

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frontedge-ml/ui build
      - run: pnpm --filter @frontedge-ml/ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      # The wheel ships the built interface: without this the package serves 503.
      - run: pnpm build:ui
      - name: Build the wheel
        run: uv build --package frontedge
      - name: Publish to PyPI
        run: uv publish dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
