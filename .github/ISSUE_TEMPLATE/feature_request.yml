name: Feature request
description: Something the interface or the package should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the situation, not the solution: what are you doing, and where does the current
        interface get in your way?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runs
        - Run detail
        - Evals
        - Datasets
        - Actions and configuration
        - Design system
        - Python package
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: What you are trying to do, and what you do instead
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would want instead
      description: Optional. If you have a shape in mind, describe it or attach a sketch.
  - type: checkboxes
    id: extension
    attributes:
      label: Extension point
      options:
        - label: This could be a declared action (a button with a handler in the project code)
        - label: This could be a column in the configuration
        - label: This needs a new screen or component
