[project]
name = "frontedge-demo-ml"
version = "0.1.0"
description = "Demo ML backend with the frontedge interface mounted into FastAPI"
requires-python = ">=3.11"
dependencies = [
    "frontedge",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
demo-ml = "demo_ml.app:main"

[tool.uv.sources]
frontedge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_ml"]

