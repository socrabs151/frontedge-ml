# Interface configuration for frontedge in this demo.
# The file is read at startup: /frontedge/api/config serves it to the interface.

density = "default"
theme = "light"

# Which tabs the evaluation screen shows. An empty list — all of them.
eval_tabs = ["examples", "summary"]

# Which columns to show in the run list. An empty list — show all.
run_columns = ["name", "status", "ribbon", "dataset", "startedAt", "durationMs", "accuracy", "loss", "bleu"]

# Starting widths and resize locks. The user may resize any column unless resizable = false;
# column_resize = false would lock the whole table.
[[columns]]
id = "name"
width = 140

[[columns]]
id = "status"
resizable = false

# Metrics of the project: the run screen draws a card for each one, and a chart when the run
# has a series for it. Without this list, every metric a run returns is shown.
# "bleu" is a metric the interface knows nothing about — it appears because the project declares it.

[[metrics]]
id = "accuracy"
label = "Accuracy"
direction = "maximize"

[[metrics]]
id = "loss"
label = "Loss"
direction = "minimize"

[[metrics]]
id = "f1"
label = "F1"
direction = "maximize"

[[metrics]]
id = "bleu"
label = "BLEU"
direction = "maximize"
digits = 2

[[metrics]]
id = "tokens"
label = "Tokens"
digits = 0
chart = false

# Actions — what the project can do with its runs.
# Handlers are registered in code: demo_ml/app.py -> actions={...}

[[actions]]
id = "stop"
label = "Stop"
placement = "run"
danger = true
description = "Stops the run and frees the GPU"

[[actions]]
id = "export"
label = "Export CSV"
placement = "run"
description = "Exports the run metrics to CSV"

[[actions]]
id = "rerun"
label = "Rerun"
placement = "runs"
description = "Restarts the run with the same seed"
