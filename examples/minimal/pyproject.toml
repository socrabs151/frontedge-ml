[project]
name = "frontedge-example-minimal"
version = "0.1.0"
description = "A minimal Frontedge dashboard: one provider, one config, two sample runs"
requires-python = ">=3.11"
dependencies = [
    "frontedge",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.uv.sources]
frontedge = { workspace = true }

