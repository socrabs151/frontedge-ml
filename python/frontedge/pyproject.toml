[project]
name = "frontedge"
version = "0.5.0"
description = "Frontend layer for ML engineering: mount ready-made screens into any FastAPI app"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "socrabs151" }]
keywords = ["ml", "mlops", "fastapi", "experiments", "dashboard", "runs", "evaluation"]
license = { text = "MIT" }
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.32"]

[project.urls]
Homepage = "https://github.com/socrabs151/frontedge-ml"
Repository = "https://github.com/socrabs151/frontedge-ml"
Issues = "https://github.com/socrabs151/frontedge-ml/issues"
Changelog = "https://github.com/socrabs151/frontedge-ml/blob/main/CHANGELOG.md"
Documentation = "https://github.com/socrabs151/frontedge-ml/blob/main/docs/integration.md"

[project.scripts]
frontedge = "frontedge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontedge"]
# The built interface is copied into src/frontedge/static (build: pnpm build && pnpm build:ui)
artifacts = ["src/frontedge/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
