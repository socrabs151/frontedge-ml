[project]
name = "frontedge"
version = "0.1.0"
description = "Frontend layer for ML engineering: mount ready-made screens into any FastAPI app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[project.scripts]
frontedge = "frontedge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontedge"]
# Собранный интерфейс кладётся в src/frontedge/static (сборка: pnpm build && pnpm build:ui)
artifacts = ["src/frontedge/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
