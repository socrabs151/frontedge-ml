<!doctype html>
<html lang="en" data-theme="light" data-density="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Frontedge — a reusable frontend layer for ML projects: runs, datasets, evaluations, traces."
    />
    <title>@@FRONTEDGE_TITLE@@</title>
    <!-- The server substitutes the mount path, so the interface works under any prefix.
         A meta tag instead of an inline script: a strict CSP needs no 'unsafe-inline'. -->
    <meta name="frontedge-mount" content="@@FRONTEDGE_MOUNT@@" />
  </head>
  <body>
    <div id="root" class="fe-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
